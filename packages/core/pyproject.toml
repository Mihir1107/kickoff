[project]
name = "edisc-core"
version = "0.1.0"
description = "Canonical schemas, domain models, settings, IDs, time utilities."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rfc8785>=0.1.4",
    "structlog>=26.1.0",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_core"]
