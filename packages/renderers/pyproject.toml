[project]
name = "edisc-renderers"
version = "0.1.0"
description = "RSMF renderer (pure: no database or cloud imports)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-core",
    "edisc-custody",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "tzdata==2026.5",
]

[tool.uv.sources]
edisc-core = { workspace = true }
edisc-custody = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_renderers"]
