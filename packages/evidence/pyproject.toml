[project]
name = "edisc-evidence"
version = "0.1.0"
description = "Evidence writer: streaming SHA-256, S3 multipart upload, object lock."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiobotocore>=3.9.1",
    "edisc-core",
    "edisc-db",
]

[tool.uv.sources]
edisc-core = { workspace = true }
edisc-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_evidence"]
