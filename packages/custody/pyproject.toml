[project]
name = "edisc-custody"
version = "0.1.0"
description = "Append-only, hash-chained chain-of-custody log and verifier."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-core",
    "edisc-db",
    "edisc-evidence",
]

[project.scripts]
edisc-verify = "edisc_custody.cli:main"

[tool.uv.sources]
edisc-core = { workspace = true }
edisc-db = { workspace = true }
edisc-evidence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_custody"]
