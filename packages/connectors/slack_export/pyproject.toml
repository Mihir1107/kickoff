[project]
name = "edisc-connector-slack-export"
version = "0.1.0"
description = "Slack export (zip) ingestion: archive layout, tier detection, connector (ADR 0014)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-connectors-base",
    "edisc-core",
    "edisc-custody",
    "edisc-db",
    "edisc-evidence",
    "httpx>=0.28.1",
]

[tool.uv.sources]
edisc-connectors-base = { workspace = true }
edisc-core = { workspace = true }
edisc-custody = { workspace = true }
edisc-db = { workspace = true }
edisc-evidence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_connector_slack_export"]
