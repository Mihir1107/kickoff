[project]
name = "edisc-connector-slack"
version = "0.1.0"
description = "Slack connector (Phase 3, stub)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-connectors-base",
]

[tool.uv.sources]
edisc-connectors-base = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_connector_slack"]
