[project]
name = "edisc-connectors-base"
version = "0.1.0"
description = "Connector protocol, work units, cursors, rate limit hook."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-core",
]

[tool.uv.sources]
edisc-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_connectors_base"]
