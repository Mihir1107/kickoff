[project]
name = "edisc-verify"
version = "0.1.0"
description = "Offline verifier for eDiscovery custody, render and report packages (no database, storage or services)."
requires-python = ">=3.12,<3.13"
# pinned exactly: a third party installs exactly these (the hashed requirements file
# requirements.lock is generated from uv.lock: scripts/verifier_standalone.py)
dependencies = [
    "cryptography==50.0.1",
    "rfc8785==0.1.4",
]

[project.scripts]
edisc-verify = "edisc_verify.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_verify"]
reproducible = true
