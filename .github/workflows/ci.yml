name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.11"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run mypy packages apps workers

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v4  # independent RFC 8785 reference for the canonical JSON cross-check
        with:
          node-version: "20"
      - run: uv sync --all-packages --locked
      - run: uv run pytest tests/unit

  integration:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      # fresh ephemeral stack (project edisc-test, EDISC_ENV=test), destroyed after the run;
      # hosted runners have ~14 GB free, enough for the CI service subset
      - run: make test-integration MIN_FREE_GB=8
      - name: Upload test stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-stack-logs
          path: test-stack-logs.txt
          if-no-files-found: ignore
