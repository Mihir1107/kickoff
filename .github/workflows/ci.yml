name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # e.g. to prove the failure artifacts on a throwaway branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.11"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run mypy packages apps workers

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7  # independent RFC 8785 reference for the canonical JSON cross-check
        with:
          node-version: "24"
      - run: uv sync --all-packages --locked
      # other unzippers the package zip must open (ADR 0015 §19); the tests fail in CI without them
      - run: command -v 7z && command -v unzip || (sudo apt-get update && sudo apt-get install -y p7zip-full unzip)
      - run: uv run pytest tests/unit

  integration:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: command -v 7z && command -v unzip || (sudo apt-get update && sudo apt-get install -y p7zip-full unzip)
      # fresh ephemeral stack (project edisc-test, EDISC_ENV=test), destroyed after the run;
      # hosted runners have ~14 GB free, enough for the CI service subset
      # a failing test leaves its worker logs, Temporal histories and custody streams here
      # (tests/integration/artifacts.py), collected before the stack is destroyed
      - run: make test-integration MIN_FREE_GB=8
        env:
          EDISC_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/test-artifacts
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-stack-logs.txt
            ${{ runner.temp }}/test-artifacts
          if-no-files-found: warn
          retention-days: 14
