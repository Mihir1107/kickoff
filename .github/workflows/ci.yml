name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.11"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run mypy packages apps workers

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7  # independent RFC 8785 reference for the canonical JSON cross-check
        with:
          node-version: "24"
      - run: uv sync --all-packages --locked
      - run: uv run pytest tests/unit

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # the OpenAPI spec is dumped from the FastAPI app
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --locked
      - run: npm ci  # the lockfile carries every platform's native binaries (rollup, tailwind oxide, lightningcss)
      - run: npm run check:api  # fails when openapi.json or src/api/schema.gen.ts is stale against the backend
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: a demo build must fail
        run: |
          if VITE_API_MODE=demo npm run build; then
            echo "::error::a production build accepted VITE_API_MODE=demo"; exit 1
          fi

  integration:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      # fresh ephemeral stack (project edisc-test, EDISC_ENV=test), destroyed after the run;
      # hosted runners have ~14 GB free, enough for the CI service subset
      - run: make test-integration MIN_FREE_GB=8
      - name: Upload test stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-stack-logs
          path: test-stack-logs.txt
          if-no-files-found: ignore
