name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]  # release builds: the production-readiness job blocks them
  pull_request:
  workflow_dispatch:  # e.g. to prove the failure artifacts on a throwaway branch

# Branches and PRs: a newer push cancels the older run. main: every commit gets its own full result
# (its own group: GitHub cancels a PENDING run of a group even without cancel-in-progress).
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.10.11"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run mypy packages apps workers

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7  # independent RFC 8785 reference for the canonical JSON cross-check
        with:
          node-version: "24"
      - run: uv sync --all-packages --locked
      # other unzippers the package zip must open (ADR 0015 §19); the tests fail in CI without them
      - run: command -v 7z && command -v unzip || (sudo apt-get update && sudo apt-get install -y p7zip-full unzip)
      - run: uv run pytest tests/unit tests/real_idp  # real_idp: skipped, with its reason, without a tenant
      # prove the integration shards (below) are a disjoint cover: every test runs exactly once
      - run: uv run python scripts/ci_shard.py --of 4 --verify

  # the published API contract (M17 step 4, plan §5): docs/api/openapi.json matches the code (the
  # unit job's drift test too), and nothing breaks against the base: oasdiff (pinned by checksum in
  # scripts/api_compat.py) + our rules + the reviewed allow-list; the summary lists warnings (D9)
  api-compat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base commit's spec
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: make openapi-check
      - name: Compare with the base
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then base=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then base="$BEFORE"
          else base=$(git rev-parse HEAD~1); fi
          echo "base: $base"
          uv run python scripts/api_compat.py --base-ref "$base"

  # Is the tree fit for a production build (scripts/production_readiness.py: a break the frontend
  # has not absorbed, status pending_frontend, refuses it)? Release tags enforce: the job fails.
  # Everywhere else the same findings are one warning annotation each plus a job summary, and the
  # job is green, so red always means something (a malformed allow-list fails in both modes). The
  # production report image enforces on its own (its `readiness` stage).
  production-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: make production-readiness READINESS_MODE=${{ startsWith(github.ref, 'refs/tags/v') && 'enforce' || 'warn' }}

  integration:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    # Sharded into 4 balanced jobs (scripts/ci_shard.py, by measured duration): each runs ~1/4 of
    # the ~22 min suite on its own ephemeral stack, about 10-12 min wall including stack up/down, so
    # the stage finishes (slowest shard) well under 20 min and the 45-minute limit has real headroom.
    # The per-test 120 s timeout still catches hangs. fail-fast off so every shard reports.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]  # keep in sync with EDISC_CI_SHARDS below and ci_shard.py --of
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: command -v 7z && command -v unzip || (sudo apt-get update && sudo apt-get install -y p7zip-full unzip)
      # the preview's no-remote-fetch test drives a headless Chromium; the sign-in test (ADR 0016 A1)
      # runs in Chromium, Firefox and WebKit (Playwright pinned in uv.lock)
      - run: uv run playwright install --with-deps chromium firefox webkit
      # fresh ephemeral stack (project edisc-test, EDISC_ENV=test), destroyed after the run;
      # hosted runners have ~14 GB free, enough for the CI service subset. The conftest deselects every
      # test not in this shard (EDISC_CI_SHARDS/EDISC_CI_SHARD). A failing test leaves its worker logs,
      # Temporal histories and custody streams here (tests/integration/artifacts.py), kept per shard.
      - run: make test-integration MIN_FREE_GB=8
        env:
          EDISC_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/test-artifacts
          EDISC_TEST_PHASE_TIMINGS_DIR: ${{ runner.temp }}/phase-timings
          EDISC_CI_SHARDS: "4"
          EDISC_CI_SHARD: ${{ matrix.shard }}
      # per-phase timings of the tests that record them (tests/integration/phase_timings.py), pass
      # or fail: what a slow runner spent where (ADR 0015 §24.20)
      - name: Upload phase timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-timings-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/phase-timings
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-failure-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: |
            test-stack-logs.txt
            ${{ runner.temp }}/test-artifacts
          if-no-files-found: warn
          retention-days: 14

  # M16 step 3 (ADR 0018 §5.8, §6): the report PDF inside the pinned linux/amd64 report image, natively
  # on amd64. This IS the image admission gate: the toolchain id is measured, the PDF goldens of that
  # id must match byte for byte (an image whose id has no recorded generation fails), veraPDF must pass
  # PDF/A-2u on every golden PDF, fonts stay isolated, and a real report worker container survives an
  # OOM of its PDF child (RLIMIT_AS and cgroup paths) and heartbeats while the child works.
  # The API and every worker type, started from a production install (uv sync --frozen --no-dev
  # --package <app> --no-editable, as the images install them) against the test stack: a runtime
  # import of something only the dev group provides fails here (ADR 0018 §26).
  production-install:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: make test-env-up MIN_FREE_GB=8
      - run: make test-production-install
      - if: always()
        run: make test-env-down

  # M18 step 5 (plan §5, D12): the standalone verifier. Its wheel is built twice with
  # SOURCE_DATE_EPOCH = the commit time and must be byte-identical; it is installed into an EMPTY venv
  # from the wheel and the hashed requirements (--no-index after one download); then, on real
  # packages made through the API and on tampered copies, it must answer exactly like the in-tree
  # verifier (tests/integration/api/test_verifier_standalone.py).
  verifier-standalone:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: make test-env-up MIN_FREE_GB=8
      - run: make verifier-standalone
      - if: always()
        run: make test-env-down

  report-pdf:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: make test-env-up MIN_FREE_GB=8
      - run: make test-report-pdf REPORT_PDF_OUT=${{ runner.temp }}/report-pdf
      - name: Report PDFs and veraPDF output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-pdf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/report-pdf
            test-stack-logs.txt
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: make test-env-down
