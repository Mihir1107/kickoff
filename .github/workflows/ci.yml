name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # e.g. to prove the failure artifacts on a throwaway branch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.11"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run mypy packages apps workers

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7  # independent RFC 8785 reference for the canonical JSON cross-check
        with:
          node-version: "24"
      - run: uv sync --all-packages --locked
      # other unzippers the package zip must open (ADR 0015 §19); the tests fail in CI without them
      - run: command -v 7z && command -v unzip || (sudo apt-get update && sudo apt-get install -y p7zip-full unzip)
      - run: uv run pytest tests/unit
      # prove the integration shards (below) are a disjoint cover: every test runs exactly once
      - run: uv run python scripts/ci_shard.py --of 4 --verify

  integration:
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unit]
    # Sharded into 4 balanced jobs (scripts/ci_shard.py, by measured duration): each runs ~1/4 of
    # the ~22 min suite on its own ephemeral stack, about 10-12 min wall including stack up/down, so
    # the stage finishes (slowest shard) well under 20 min and the 45-minute limit has real headroom.
    # The per-test 120 s timeout still catches hangs. fail-fast off so every shard reports.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]  # keep in sync with EDISC_CI_SHARDS below and ci_shard.py --of
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: command -v 7z && command -v unzip || (sudo apt-get update && sudo apt-get install -y p7zip-full unzip)
      # fresh ephemeral stack (project edisc-test, EDISC_ENV=test), destroyed after the run;
      # hosted runners have ~14 GB free, enough for the CI service subset. The conftest deselects every
      # test not in this shard (EDISC_CI_SHARDS/EDISC_CI_SHARD). A failing test leaves its worker logs,
      # Temporal histories and custody streams here (tests/integration/artifacts.py), kept per shard.
      - run: make test-integration MIN_FREE_GB=8
        env:
          EDISC_TEST_ARTIFACTS_DIR: ${{ runner.temp }}/test-artifacts
          EDISC_CI_SHARDS: "4"
          EDISC_CI_SHARD: ${{ matrix.shard }}
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-failure-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: |
            test-stack-logs.txt
            ${{ runner.temp }}/test-artifacts
          if-no-files-found: warn
          retention-days: 14
