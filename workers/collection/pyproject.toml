[project]
name = "edisc-worker"
version = "0.1.0"
description = "Temporal collection workers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-connector-dummy",
    "edisc-connector-slack-export",
    "edisc-connectors-base",
    "edisc-core",
    "edisc-custody",
    "edisc-db",
    "edisc-evidence",
    "edisc-normalizer",
    "edisc-renderers",
    "temporalio>=1.33.0",
]

[tool.uv.sources]
edisc-core = { workspace = true }
edisc-db = { workspace = true }
edisc-evidence = { workspace = true }
edisc-custody = { workspace = true }
edisc-normalizer = { workspace = true }
edisc-renderers = { workspace = true }
edisc-connectors-base = { workspace = true }
edisc-connector-dummy = { workspace = true }
edisc-connector-slack-export = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_worker"]
