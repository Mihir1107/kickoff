<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The ONLY fontconfig configuration the report worker loads (FONTCONFIG_FILE). No <include>:
     no conf.d, no system font dirs, no ~/.fonts, no XDG dirs. One font dir, one fixed cache dir. -->
<fontconfig>
  <dir>/opt/edisc/fonts</dir>
  <cachedir>/opt/edisc/fc-cache</cachedir>
  <config>
    <rescan><int>0</int></rescan>
  </config>
</fontconfig>
