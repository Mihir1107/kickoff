[project]
name = "edisc-api"
version = "0.1.0"
description = "FastAPI service: tenants, matters, connections, jobs, reports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-core",
]

[tool.uv.sources]
edisc-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edisc_api"]
