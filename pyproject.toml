[project]
name = "edisc-workspace"
version = "0.1.0"
description = "eDiscovery collaboration data collection module (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edisc-core",
    "edisc-db",
    "edisc-evidence",
    "edisc-custody",
    "edisc-connectors-base",
    "edisc-connector-dummy",
    "edisc-connector-slack",
    "edisc-connector-teams",
    "edisc-normalizer",
    "edisc-renderers",
    "edisc-api",
    "edisc-worker",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "hypothesis>=6.140",
    "asyncpg>=0.31.0",
    "redis>=8.1.0",
    "boto3>=1.43",
    "temporalio>=1.33.0",
    "httpx>=0.28.1",
    "asyncpg-stubs>=0.31.3",
    "types-aiobotocore[s3]>=3.9.1",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/db",
    "packages/evidence",
    "packages/custody",
    "packages/connectors/base",
    "packages/connectors/dummy",
    "packages/connectors/slack",
    "packages/connectors/teams",
    "packages/normalizer",
    "packages/renderers",
    "apps/api",
    "workers/collection",
]

[tool.uv.sources]
edisc-core = { workspace = true }
edisc-db = { workspace = true }
edisc-evidence = { workspace = true }
edisc-custody = { workspace = true }
edisc-connectors-base = { workspace = true }
edisc-connector-dummy = { workspace = true }
edisc-connector-slack = { workspace = true }
edisc-connector-teams = { workspace = true }
edisc-normalizer = { workspace = true }
edisc-renderers = { workspace = true }
edisc-api = { workspace = true }
edisc-worker = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/connectors/*/src", "apps/*/src", "workers/*/src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "DTZ", "T20",
    "SIM", "RUF", "ASYNC", "PT", "TRY", "PERF",
]
ignore = [
    "TRY003",  # long messages in exception constructors are fine
    "E501",    # ruff format owns code layout; long docstrings/strings are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607", "S608", "T20", "BLE001", "TRY301", "PT018", "RUF059"]
"scripts/**" = ["T20", "S311", "PERF401"]
# migrations interpolate only module-level constants and fixed identifiers into DDL
"packages/db/migrations/**" = ["S608"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = [
    "packages/core/src",
    "packages/db/src",
    "packages/evidence/src",
    "packages/custody/src",
    "packages/connectors/base/src",
    "packages/connectors/dummy/src",
    "packages/connectors/slack/src",
    "packages/connectors/teams/src",
    "packages/normalizer/src",
    "packages/renderers/src",
    "apps/api/src",
    "workers/collection/src",
]
plugins = []

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
# hangs (e.g. a deadlock through the application) fail loudly instead of blocking CI
timeout = 120
# temporary test outputs are deleted after the run (large ones live under --basetemp, cleaned by make)
tmp_path_retention_policy = "none"
markers = [
    "integration: requires the docker compose services (make up)",
    "slow: long-running acceptance tests",
    "elasticsearch: needs Elasticsearch (not started in CI during Phase 1)",
]
